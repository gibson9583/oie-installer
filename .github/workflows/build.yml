name: Build native installers
on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
    inputs:
      engine_version:
        description: Engine release, or latest
        default: latest
        required: true
permissions:
  contents: read
concurrency:
  group: native-installers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine:
    # The engine distribution, built once from its release tag with Gradle and shared by every platform.
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: installer
      - name: Resolve engine release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.engine_version || 'latest' }}
        run: |
          version="$REQUESTED_VERSION"
          if [ "$version" = latest ]; then
            version=$(gh api repos/OpenIntegrationEngine/engine/releases/latest --jq .tag_name)
            version="${version#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid engine release: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: OpenIntegrationEngine/engine
          ref: v${{ steps.version.outputs.version }}
          fetch-depth: 1
          path: engine
      - name: Set up the Gradle JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            engine/**/*.gradle*
            engine/gradle/libs.versions.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the engine
        working-directory: installer
        run: python -u build.py --version "${{ steps.version.outputs.version }}" --engine-repo ../engine --java-home "$JAVA_HOME" --engine-only
      - uses: actions/upload-artifact@v7
        with:
          name: engine-build
          path: installer/dist/engine/*
          if-no-files-found: error
          retention-days: 14

  installer:
    # The OIE install4j media: each platform with and without a bundled engine Java runtime, and the engine archives.
    name: ${{ matrix.name }}
    needs: engine
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ENGINE_VERSION: ${{ needs.engine.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-arm64, name: macOS ARM64, runner: macos-15, type: dmg }
          - { id: macos-x64, name: macOS x64, runner: macos-15-intel, type: dmg }
          - { id: windows-x64, name: Windows x64, runner: windows-2025, type: exe }
          # OpenJFX has no Windows ARM64 build: the wizard uses Liberica Full JDK, which includes JavaFX for ARM64.
          - { id: windows-arm64, name: Windows ARM64, runner: windows-11-arm, type: exe, wizard-jdk: liberica-full }
          - { id: linux-x64, name: Linux x64, runner: ubuntu-24.04, type: sh }
          - { id: linux-arm64, name: Linux ARM64, runner: ubuntu-24.04-arm, type: sh }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: installer
      - uses: actions/download-artifact@v8
        with:
          name: engine-build
          path: installer/target/engine-build
      - uses: actions/checkout@v7
        with:
          repository: OpenIntegrationEngine/engine
          ref: v${{ env.ENGINE_VERSION }}
          fetch-depth: 1
          path: engine
      - name: Set up the engine JDK
        id: engine-jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Platform releases can arrive at different times; resolve the latest Java 21 for each.
          java-version: '21'
          check-latest: true
          cache: maven
          cache-dependency-path: installer/pom.xml
      - name: Set up the wizard JDK
        # Neither OpenJFX nor Zulu publishes JavaFX for Windows ARM64. Liberica Full JDK includes it.
        if: matrix.wizard-jdk == 'liberica-full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $query = 'https://api.bell-sw.com/v1/liberica/releases?version-feature=21&version-modifier=latest&os=windows&arch=arm&bitness=64&bundle-type=jdk-full&package-type=zip'
          # PowerShell 7 returns a JSON array as one object; enumerate it and take the newest release.
          $release = Invoke-RestMethod $query -UserAgent 'oie-installer-build' | ForEach-Object { $_ } | Select-Object -First 1
          if (-not $release) { throw 'BellSoft lists no Liberica Full JDK 21 for Windows ARM64' }
          Write-Host "$($release.filename)"
          # The download is a GitHub release asset; check GitHub's SHA-256 digest as well as BellSoft's SHA-1.
          if ($release.downloadUrl -notmatch '^https://github\.com/bell-sw/Liberica/releases/download/([^/]+)/') { throw "Unexpected download location: $($release.downloadUrl)" }
          $filter = '.assets[] | select(.name == "{0}") | .digest' -f $release.filename
          $digest = gh api "repos/bell-sw/Liberica/releases/tags/$($Matches[1])" --jq $filter
          if ($LASTEXITCODE -ne 0) { throw "Cannot read the GitHub release for $($release.filename)" }
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "GitHub has no digest for $($release.filename)" }
          $zip = Join-Path $env:RUNNER_TEMP $release.filename
          Invoke-WebRequest $release.downloadUrl -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $digest.Substring(7)) { throw "$($release.filename) does not match GitHub's SHA-256" }
          if ((Get-FileHash $zip -Algorithm SHA1).Hash -ne $release.sha1) { throw "$($release.filename) does not match BellSoft's SHA-1" }
          $target = Join-Path $env:RUNNER_TEMP 'liberica-full'
          Expand-Archive $zip $target
          $jdk = (Get-ChildItem $target -Directory)[0].FullName
          if (-not (Test-Path (Join-Path $jdk 'jmods\javafx.controls.jmod'))) { throw "$($release.filename) has no JavaFX modules" }
          & (Join-Path $jdk 'bin\java.exe') -version
          "JAVA_HOME=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$jdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Windows launcher and registration
        working-directory: installer
        run: python -m unittest discover -s tests -v
      - name: Prepare NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS\makensis.exe'
          # Chocolatey can report success without installing when its feed fails; check the result and retry.
          for ($attempt = 1; -not (Test-Path $nsis) -and $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) { Start-Sleep -Seconds (20 * $attempt) }
            choco install nsis --yes --no-progress
          }
          if (-not (Test-Path $nsis)) { throw "NSIS installation failed" }
          "$((Split-Path $nsis))" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build installer
        working-directory: installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENGINE_JDK: ${{ steps.engine-jdk.outputs.path }}
        run: python -u build.py --version "$ENGINE_VERSION" --engine-repo ../engine --engine-archive "target/engine-build/oie-engine-$ENGINE_VERSION.tar.gz" --java-home "$JAVA_HOME" --engine-java-home "$ENGINE_JDK" --type "${{ matrix.type }}"
      - name: Test file cleanup
        working-directory: installer
        run: python ci/check_file_cleanup.py
      - name: Test process startup in the user session
        working-directory: installer
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python ci/check_session_start.py --engine
          else
            python ci/check_session_start.py
          fi
      - name: Test system appearance and completion links
        working-directory: installer
        run: |
          python ci/check_system_appearance.py
          python ci/check_completion_links.py
      - name: Test Linux desktop session
        if: runner.os == 'Linux'
        working-directory: installer
        run: python ci/check_desktop_session.py
      - name: Test Windows service operations
        if: runner.os == 'Windows'
        working-directory: installer
        run: python -u ci/check_windows_services.py
      - name: Install, operate and uninstall the engine
        working-directory: installer
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -u ci/smoke_install.py
          else
            sudo env JAVA_HOME="$JAVA_HOME" "$(command -v python3)" -u ci/smoke_install.py
          fi
      - name: Install on Linux without systemd
        if: runner.os == 'Linux'
        working-directory: installer
        run: |
          package=$(ls dist/oie_unix_*-with-JRE.sh | head -1)
          docker run --rm -v "$PWD:/w:ro" debian:12 sh /w/ci/check_initd.sh "/w/$package"
      - name: Upload installer with JRE
        uses: actions/upload-artifact@v7
        with:
          name: oie-installer-${{ matrix.id }}-with-JRE
          path: |
            installer/dist/*-with-JRE.*
            installer/dist/build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload installer without JRE
        uses: actions/upload-artifact@v7
        with:
          name: oie-installer-${{ matrix.id }}-without-JRE
          path: |
            installer/dist/*
            !installer/dist/*-with-JRE.*
            !installer/dist/*.tar.gz*
            !installer/dist/*.zip*
            !installer/dist/engine
          if-no-files-found: error
          retention-days: 14
      - name: Upload engine archive
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: oie-archive-${{ matrix.id }}
          path: |
            installer/dist/*.tar.gz*
            installer/dist/*.zip*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            installer/target/windows-bootstrap.nsi
            installer/payload/manifest.json
            installer/payload/engine/oiecommand.exe
          if-no-files-found: ignore
      - name: Preserve macOS session startup checks
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: session-start-${{ matrix.id }}
          path: installer/target/session-start-check/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Windows service checks
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: service-checks-${{ matrix.id }}
          path: |
            installer/ci/performance-windows-services.json
            installer/ci/performance-windows-services.log
            installer/ci/provenance/**
          if-no-files-found: ignore
          retention-days: 14
